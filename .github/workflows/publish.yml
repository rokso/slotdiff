name: Publish

# Run by hand: `gh workflow run publish.yml -f dist-tag=latest`. npm trusts
# this workflow through trusted publishing (OIDC), so no npm token is stored,
# and the package gets a provenance attestation linking it to this repository
# and commit. It only stages the release: nothing is public until a maintainer
# runs `npm stage approve <stage-id>` with 2FA.
on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag
        required: true
        type: choice
        options: [alpha, latest]

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The newest Node 24, for its npm: `npm stage` needs npm 11.15.0+ (trusted
          # publishing alone needs 11.5.1+). No registry-url: trusted publishing needs no .npmrc.
          node-version: "24"
          check-latest: true
      # No dependency install scripts in the job that can mint the publish token
      # (keccak and secp256k1 only build optional native addons).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check npm supports staged publishing
        run: |
          npm --version
          # Compares versions part by part as numbers, so 11.9 sorts before 11.15.
          node -e 'if (process.argv[1].localeCompare("11.15.0", "en", { numeric: true }) < 0) {
            console.error(`npm ${process.argv[1]} has no "npm stage"; it needs 11.15.0 or newer.`);
            process.exit(1);
          }' "$(npm --version)"
      # prepublishOnly runs lint and tests; prepack builds. Prints the stage id.
      - run: npm stage publish --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
