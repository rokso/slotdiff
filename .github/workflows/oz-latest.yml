name: OpenZeppelin latest

# slotdiff imports a few OpenZeppelin upgrades-core files that are not its
# public API, and accepts any 1.x. A 1.x release that moves one would break
# every install; this finds out before users do.
on:
  schedule:
    # Mondays 16:30 UTC, after Scorecard.
    - cron: "30 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The newest version package.json allows, as a fresh install gets it.
      - run: pnpm update @openzeppelin/upgrades-core
      - run: node -p "'upgrades-core ' + require('@openzeppelin/upgrades-core/package.json').version"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node -e "require('./dist/index.js')"
